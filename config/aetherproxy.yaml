server:
  host: 127.0.0.1
  port: 8080

load_balancing:
  strategy: round_robin

health_check:
  interval_seconds: 5
  timeout_seconds: 2
  failure_threshold: 2
  success_threshold: 2

backends:
  - host: 127.0.0.1
    port: 9001
    weight: 3

  - host: 127.0.0.1
    port: 9002
    weight: 2

  - host: 127.0.0.1
    port: 9004
    weight: 1
