services:
  # The Edge Reverse Proxy (Terminates SSL)
  caddy-ingress:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/caddy/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - aether_vpc

  # The C++20 Application Backend
  aether-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DB_HOST=aether-db
    networks:
      - aether_vpc
    depends_on:
      - aether-db

  # The Isolated Relational Database
  aether-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aetheradmin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: aetherdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - aether_vpc

networks:
  aether_vpc:
    driver: bridge

volumes:
  pg_data:
